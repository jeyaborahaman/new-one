# /etc/nginx/sites-available/jeyabo-api  (replace api.example.com with your domain)
upstream jeyabo_api { server 127.0.0.1:4000; keepalive 64; }
server {
  listen 80; server_name api.example.com;
  client_max_body_size 1m;  # media goes straight to R2, never through this server
  location /socket.io/ {
    proxy_pass http://jeyabo_api; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host; proxy_read_timeout 75s;
  }
  location / {
    proxy_pass http://jeyabo_api; proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
  }
}
